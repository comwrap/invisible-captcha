  function shuffle(array) {
    var copy = array.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = copy[i];
      copy[i] = copy[j];
      copy[j] = temp;
    }
    return copy;
  }

  function showFeedback(type, message) {
    feedbackBox.classList.remove("hidden", "border-rose-200", "bg-rose-50", "text-rose-700", "border-emerald-200", "bg-emerald-50", "text-emerald-700", "border-indigo-200", "bg-indigo-50", "text-indigo-700");
    if (type === "error") {
      feedbackBox.classList.add("border-rose-200", "bg-rose-50", "text-rose-700");
    } else if (type === "success") {
      feedbackBox.classList.add("border-emerald-200", "bg-emerald-50", "text-emerald-700");
    } else {
      feedbackBox.classList.add("border-indigo-200", "bg-indigo-50", "text-indigo-700");
    }
    feedbackBox.textContent = message;
  }

  function hideFeedback() {

    button.dataset.id = id;
    button.dataset.selectable = "true";
    button.setAttribute("aria-pressed", "false");
    button.setAttribute("aria-label", "Tile " + (index + 1) + ": " + tile.label);
    button.className = "aspect-square rounded-xl bg-gradient-to-br " + tile.bg + " border-2 border-transparent hover:border-indigo-300 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition duration-200 flex flex-col items-center justify-center gap-1 sm:gap-2 shadow-sm " + tile.text;

    iconEl.textContent = tile.icon;

    labelEl.className = "text-[8px] sm:text-[10px] md:text-xs font-bold uppercase tracking-wide text-gray-600 truncate max-w-full px-1";
    labelEl.textContent = tile.label;

    button.appendChild(iconEl);
    button.appendChild(labelEl);
    button.addEventListener("click", function () {
      clickHandler(button, id);
    });
    return button;
  }

    var piece = document.createElement("div");
    piece.id = "alignPiece";
    piece.className = "absolute top-1/2 w-10 h-10 sm:w-14 sm:h-14 -translate-x-1/2 -translate-y-1/2 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-lg flex items-center justify-center text-xl sm:text-2xl font-black transition-[left] duration-75";
    piece.style.left = puzzle.start + "%";
    piece.textContent = "\u25C6";
    piece.setAttribute("aria-hidden", "true");

    var hint = document.createElement("p");    hint.className = "absolute bottom-2 sm:bottom-3 left-3 right-3 sm:left-4 sm:right-4 text-center text-[10px] sm:text-xs font-medium text-gray-500";
    hint.textContent = "Move the piece into the dashed outline.";

    scene.appendChild(track);
    scene.appendChild(gap);
    scene.appendChild(piece);
    scene.appendChild(hint);

    var range = document.createElement("input");
    range.id = "alignRange";
    range.type = "range";
    range.min = "0";
    range.max = "100";
    range.step = "1";
    range.value = String(puzzle.start);
    range.className = "w-full accent-indigo-600 cursor-pointer";
    range.setAttribute("aria-label", "Puzzle piece horizontal position");
    range.addEventListener("input", function () {
      activeChallenge.value = Number(range.value);
      piece.style.left = range.value + "%";
      hideFeedback();
    });

    tileGrid.appendChild(scene);
    tileGrid.appendChild(range);
  }

  function renderPatternPuzzle() {
    var puzzle = patternPuzzles[Math.floor(Math.random() * patternPuzzles.length)];    var totalCols = puzzle.sequence.length + 1;

    updateChallengeCopy(puzzle.title, puzzle.instruction, puzzle.prompt, "pattern");
    submitChallengeButton.textContent = "Verify answer";
    clearSelectionButton.textContent = "Clear";
    clearSelectionButton.classList.remove("hidden");
    tileGrid.className = "space-y-3 sm:space-y-4 min-h-[14rem] sm:min-h-[18rem]";
    tileGrid.setAttribute("aria-label", "Visual pattern puzzle");
    tileGrid.innerHTML = "";
    activeChallenge = { type: "pattern", correctId: puzzle.options.find(function (o) { return o.correct; }).id };

    var sequence = document.createElement("div");
    sequence.className = "grid gap-1.5 sm:gap-2";
    sequence.style.gridTemplateColumns = "repeat(" + totalCols + ", minmax(0, 1fr))";

    puzzle.sequence.forEach(function (tile, index) {
      var cell = document.createElement("div");
      cell.className = "aspect-square rounded-xl bg-gradient-to-br " + tile.bg + " border border-white shadow-sm flex items-center justify-center text-lg sm:text-2xl md:text-3xl font-black " + tile.text;
      cell.setAttribute("aria-label", "Pattern item " + (index + 1) + ": " + tile.label);
      cell.textContent = tile.icon;
      sequence.appendChild(cell);
    });

    var missing = document.createElement("div");
    missing.className = "aspect-square rounded-xl border-2 border-dashed border-indigo-400 bg-indigo-50 flex items-center justify-center text-xl sm:text-3xl font-black text-indigo-500";
    missing.setAttribute("aria-label", "Missing pattern item");
    missing.textContent = "?";
    sequence.appendChild(missing);

    var optionLabel = document.createElement("p");
    optionLabel.className = "text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-gray-500";
    optionLabel.textContent = "Answer choices";

    var options = document.createElement("div");
    options.className = "grid grid-cols-2 gap-1.5 sm:gap-2";

    puzzle.options.forEach(function (option, index) {
      options.appendChild(makeTileButton(option, index, option.id, selectPatternOption));
    });

    tileGrid.appendChild(sequence);
    tileGrid.appendChild(optionLabel);
    tileGrid.appendChild(options);
  }

  function generatePuzzle() {
    selectedTiles.clear();
    correctTiles.clear();
    hideFeedback();
    var renderers = [renderTilePuzzle, renderAlignPuzzle, renderPatternPuzzle];
    renderers[Math.floor(Math.random() * renderers.length)]();
  }

  function toggleTile(button, id) {
    if (selectedTiles.has(id)) {
      selectedTiles.delete(id);      button.setAttribute("aria-pressed", "false");
      button.classList.remove("border-indigo-600", "ring-4", "ring-indigo-100", "scale-[0.98]");
      button.classList.add("border-transparent");
    } else {
      selectedTiles.add(id);
      button.setAttribute("aria-pressed", "true");
      button.classList.remove("border-transparent");
      button.classList.add("border-indigo-600", "ring-4", "ring-indigo-100", "scale-[0.98]");
    }
    hideFeedback();
  }

  function selectPatternOption(button, id) {
    selectedTiles.clear();
    Array.from(tileGrid.querySelectorAll("button[data-selectable='true']")).forEach(function (b) {
      b.setAttribute("aria-pressed", "false");
      b.classList.remove("border-indigo-600", "ring-4", "ring-indigo-100", "scale-[0.98]");
      b.classList.add("border-transparent");
    });
    selectedTiles.add(id);
    button.setAttribute("aria-pressed", "true");
    button.classList.remove("border-transparent");
    button.classList.add("border-indigo-600", "ring-4", "ring-indigo-100", "scale-[0.98]");    hideFeedback();
  }

  function clearSelection() {
    selectedTiles.clear();
    if (activeChallenge && activeChallenge.type === "align") {
      var range = document.getElementById("alignRange");
      var piece = document.getElementById("alignPiece");
      if (range && piece) {
        range.value = String(activeChallenge.start);
        activeChallenge.value = activeChallenge.start;
        piece.style.left = activeChallenge.start + "%";
      }
    }
    Array.from(tileGrid.querySelectorAll("button[data-selectable='true']")).forEach(function (b) {
      b.setAttribute("aria-pressed", "false");
      b.classList.remove("border-indigo-600", "ring-4", "ring-indigo-100", "scale-[0.98]");
      b.classList.add("border-transparent");
    });
    hideFeedback();
  }

  function openChallenge() {
    lastFocusedElement = document.activeElement;
    generatePuzzle();
    setState("challenge");
    modalOverlay.classList.remove("hidden");
    modalOverlay.classList.add("flex");    modalOverlay.setAttribute("aria-hidden", "false");
    document.body.classList.add("overflow-hidden");
    setTimeout(function () {
      var first = tileGrid.querySelector("button");
      if (first) first.focus();
    }, 50);
  }

  function closeChallenge(cancelled) {
    modalOverlay.classList.add("hidden");
    modalOverlay.classList.remove("flex");
    modalOverlay.setAttribute("aria-hidden", "true");
    document.body.classList.remove("overflow-hidden");
    if (cancelled && state !== "success") {
      setState(attempts > 0 ? "failure" : "unchecked");
    }
    if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
      lastFocusedElement.focus();
    }
  }

  function verifySelection() {
    attempts++;
    attemptText.textContent = "Attempts: " + attempts;

    if (!activeChallenge) {
      showFeedback("error", "Please load a challenge and try again.");
      return;
    }

    var isCorrect = false;

    if (activeChallenge.type === "tiles") {
      if (selectedTiles.size === 0) {        showFeedback("error", "Please select all matching images before verifying.");
        return;
      }
      isCorrect = selectedTiles.size === correctTiles.size;
      if (isCorrect) {
        selectedTiles.forEach(function (id) {
          if (!correctTiles.has(id)) isCorrect = false;
        });
      }
    }

    if (activeChallenge.type === "align") {
      isCorrect = Math.abs(activeChallenge.value - activeChallenge.target) <= 2;
    }

    if (activeChallenge.type === "pattern") {
      if (selectedTiles.size === 0) {
        showFeedback("error", "Please choose one answer tile before verifying.");
        return;
      }
      isCorrect = selectedTiles.has(activeChallenge.correctId);
    }

    if (isCorrect) {
      document.cookie = "isValidCaptcha=true; max-age=3600; path=/; SameSite=Lax";
      showFeedback("success", "Correct. Verification complete.");
      setTimeout(function () {
        setState("success");
        closeChallenge(false);
      }, 650);
    } else {
      setState("failure");
      if (activeChallenge.type === "align") {
        showFeedback("error", "The piece is not centered in the gap yet. Adjust and try again.");
      } else {
        showFeedback("error", "Incorrect. Review the puzzle and try again, or choose New puzzle.");
      }
    }
  }

  function startVerification() {
    if (state === "success") return;
    setState("loading");
    setTimeout(openChallenge, 450);
  }

  verifyButton.addEventListener("click", startVerification);
  closeModalButton.addEventListener("click", function () { closeChallenge(true); });
  submitChallengeButton.addEventListener("click", verifySelection);
  clearSelectionButton.addEventListener("click", clearSelection);
  refreshButton.addEventListener("click", function () {
    setState("challenge");
    generatePuzzle();
  });

  modalOverlay.addEventListener("click", function (e) {
    if (e.target === modalOverlay) closeChallenge(true);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modalOverlay.classList.contains("hidden")) {
      closeChallenge(true);
    }
    if (e.key === "Tab" && !modalOverlay.classList.contains("hidden")) {
      var focusable = Array.from(challengePanel.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])")).filter(function (el) { return !el.hasAttribute("disabled"); });
      if (focusable.length === 0) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  setState("unchecked");
})();
</script>
